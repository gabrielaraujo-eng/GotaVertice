name: Dashboard browser regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Executar testes unitários
        run: npm test
      - name: Executar regressão no Chromium
        run: npm run test:browser
