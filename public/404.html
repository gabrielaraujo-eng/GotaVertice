<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c3140" />
    <title>Página não encontrada | GotaVértice</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "DM Sans",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f4fbfb;
        color: #12323d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4fbfb;
      }
      main {
        width: min(100%, 620px);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #0e5966;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 1.05rem;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #65c1c3;
        color: #073b4c;
        font-size: 1.2rem;
      }
      .brand-mark svg {
        fill: none;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.7;
        width: 20px;
      }
      .card {
        margin-top: 28px;
        padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 72px);
        border: 1px solid #d8ecec;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 22px 70px rgba(10, 70, 80, 0.12);
      }
      .code {
        margin: 0;
        color: #65aeb2;
        font-size: clamp(4.5rem, 18vw, 8rem);
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: -0.08em;
      }
      h1 {
        margin: 24px 0 12px;
        color: #12323d;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 auto 28px;
        max-width: 430px;
        color: #5a737b;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 2px;
        text-decoration: none;
        font-weight: 700;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      a:hover {
        transform: translateY(-2px);
      }
      .primary {
        background: #0e5966;
        color: white;
        box-shadow: 0 8px 18px rgba(14, 89, 102, 0.2);
      }
      .secondary {
        border: 1px solid #c8e0e1;
        color: #0e5966;
        background: #f7ffff;
      }
      a:focus-visible {
        outline: 3px solid #f2b84b;
        outline-offset: 3px;
      }
    </style>
    <style>
      :root {
        color: #e7f4f4;
        background: #0b171b;
      }
      body {
        background: #0b171b;
        color: #e7f4f4;
      }
      article {
        background: #14272c;
        border-color: #29464c;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
      h1,
      h2,
      h3 {
        color: #e7f4f4;
      }
      .updated,
      footer {
        color: #789397;
      }
      table th {
        color: #79d4df;
      }
      table td {
        border-color: #29464c;
      }
      .notice {
        background: #173d37;
        border-color: #76d3ad;
      }
      code {
        background: #173b43;
      }
      a,
      .brand {
        color: #79d4df;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3C9 7.5 6 10.8 6 14a6 6 0 0 0 12 0c0-3.2-3-6.5-6-11Z" /></svg></span> GotaVértice
      </div>
      <section class="card" aria-labelledby="title">
        <p class="code" aria-hidden="true">404</p>
        <h1 id="title">Essa página não foi encontrada</h1>
        <p>
          O endereço pode estar incorreto ou a página pode ter sido movida.
          Volte ao início para continuar acompanhando o consumo da sua
          residência.
        </p>
        <div class="actions">
          <a class="primary" href="/login/">Ir para o login</a>
          <a class="secondary" href="/">Voltar ao início</a>
        </div>
      </section>
    </main>
  </body>
</html>
